defaults:
  - datasets: golos
  - models: xlstm_asr
  - trainer: hf_trainer
  - _self_

experiment_name: "xlstm_golos"
seed: 42
alpha: 0.0

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

output_dir: ${hydra:run.dir}

checkpoint_dir: "./multirun/2026-06-14/16-51-36/0/run_info/checkpoint-25000"

# Logging & Debug
log_level: "INFO"
debug: false