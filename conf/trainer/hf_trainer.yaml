# conf/trainer/hf_trainer.yaml

# Аргументы HuggingFace TrainingArguments
training_args:
  _target_: transformers.TrainingArguments

  output_dir: "${hydra:runtime.output_dir}/run_info"
  overwrite_output_dir: false

  # Для Iterable Dataset
  num_train_epochs: 1
  max_steps: 50000

  per_device_train_batch_size: 16
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 16
  eval_accumulation_steps: 4

  eval_strategy: "steps"
  save_strategy: "steps"
  logging_strategy: "steps"

  eval_steps: 1000
  save_steps: 4000
  logging_steps: 100

  save_total_limit: 5

  load_best_model_at_end: false
  metric_for_best_model: "eval_wer"
  greater_is_better: false

  learning_rate: 0.0005 # max_lr for CyclicLR
  weight_decay: 0.001
  warmup_ratio: 0.08

  fp16: true
  max_grad_norm: 1.0
  group_by_length: false
  remove_unused_columns: false
  report_to: "tensorboard"
  logging_dir: "${hydra:runtime.output_dir}/tensorboard"
  ddp_find_unused_parameters: false

  # Оптимизация DataLoader
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  dataloader_persistent_workers: true
  skip_memory_metrics: true

  ignore_data_skip: true

# DataCollator для ASRxLSTM (без изменений)
data_collator:
  _target_: data.data_process.DataCollatorASRWithPadding
  fixed_n_mels: ${models.num_features}
  padding_value: 0.0
  labels_pad_token_id: -100