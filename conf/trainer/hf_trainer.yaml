# conf/trainer/hf_trainer.yaml

# Аргументы HuggingFace TrainingArguments
training_args:
  _target_: transformers.TrainingArguments

  output_dir: "${hydra:runtime.output_dir}/run_info"
  overwrite_output_dir: false

  # Для Iterable Dataset
  num_train_epochs: 10
  # max_steps: 50000

  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 8
  eval_accumulation_steps: 1

  eval_strategy: "steps"
  save_strategy: "steps"
  logging_strategy: "steps"

  eval_steps: 2000
  save_steps: 4000
  logging_steps: 100

  save_total_limit: 5

  load_best_model_at_end: false
  metric_for_best_model: "eval_wer"
  greater_is_better: false

  lr_scheduler_type: "linear"
  learning_rate: 0.0001 # max_lr for CyclicLR
  weight_decay: 0.005
  warmup_ratio: 0.1

  fp16: true
  max_grad_norm: 1.0
  group_by_length: false
  remove_unused_columns: false
  report_to: "tensorboard"
  logging_dir: "${hydra:runtime.output_dir}/tensorboard"
  ddp_find_unused_parameters: false

  # Оптимизация DataLoader
  dataloader_num_workers: 8
  dataloader_pin_memory: true
  dataloader_persistent_workers: false
  skip_memory_metrics: true

  ignore_data_skip: false

lr_scheduler:
  cyclic: false
  base_lr: 5e-6
  step_size_up: 8000
  step_size_down: 8000
  mode: 'triangular2'

# DataCollator для ASRxLSTM (без изменений)
data_collator:
  _target_: data.data_process.DataCollatorASRWithPadding
  fixed_n_mels: ${models.num_features}
  padding_value: 0.0
  labels_pad_token_id: -100